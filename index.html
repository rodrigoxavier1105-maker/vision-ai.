
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 {
  letter-spacing: 4px;
  margin-top: 15px;
}

p {
  color: #aab4c5;
}

.camera {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 4 / 3;
  margin: 25px auto;
  background: #151b27;
  border: 2px solid #26354c;
  border-radius: 14px;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
}

button {
  display: block;
  width: 100%;
  max-width: 600px;
  margin: 12px auto;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #1479ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  background: #0755bd;
}

#status {
  color: #5ee6a8;
  margin-top: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>VISION AI</h1>
<p>Teste de orientação da câmera</p>

<div class="camera">
  <canvas id="screen"></canvas>
</div>

<button onclick="startCamera()">ATIVAR CÂMERA</button>
<button onclick="switchCamera()">TROCAR CÂMERA</button>

<div id="status">Câmera desligada</div>

<video id="video" autoplay playsinline muted
style="display:none"></video>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let stream = null;
let cameraMode = "user";
let animation = null;

async function startCamera() {
  try {
    stopCamera();

    statusText.textContent = "Iniciando câmera...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: cameraMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    statusText.textContent =
      cameraMode === "user"
      ? "Câmera frontal ativa — correção de espelhamento"
      : "Câmera traseira ativa";

    drawCamera();

  } catch (error) {
    statusText.textContent = "Erro: " + error.message;
  }
}

function drawCamera() {
  if (!stream || video.readyState < 2) {
    animation = requestAnimationFrame(drawCamera);
    return;
  }

  const width = video.videoWidth;
  const height = video.videoHeight;

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }

  ctx.clearRect(0, 0, width, height);

  if (cameraMode === "user") {
    // Desfaz o espelhamento da câmera frontal
    ctx.save();
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, width, height);
    ctx.restore();
  } else {
    // Câmera traseira sem espelhamento
    ctx.drawImage(video, 0, 0, width, height);
  }

  animation = requestAnimationFrame(drawCamera);
}

function stopCamera() {
  if (animation) {
    cancelAnimationFrame(animation);
    animation = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

async function switchCamera() {
  cameraMode = cameraMode === "user" ? "environment" : "user";
  await startCamera();
}

window.addEventListener("beforeunload", stopCamera);
</script>

</body>
</html>
