
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISION AI</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:22px;
  background:#080b10;
  color:white;
  font-family:Arial,sans-serif;
}

header {
  font-size:23px;
  font-weight:bold;
  letter-spacing:3px;
}

header span { color:#00e5a0; }

main {
  max-width:750px;
  margin:45px auto;
}

h1 { font-size:34px; }

p { color:#929ba8; }

.screen {
  position:relative;
  background:#111923;
  border:1px solid #263342;
  border-radius:16px;
  overflow:hidden;
  margin-top:25px;
  min-height:220px;
}

video {
  width:100%;
  height:auto;
  display:block;
  /* Sem espelhamento */
}

canvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.controls {
  display:flex;
  gap:10px;
  margin-top:15px;
}

button {
  flex:1;
  padding:16px 8px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  font-size:13px;
}

#start {
  background:#00e5a0;
  color:#00150e;
}

#switch {
  background:#1c2935;
  color:white;
  border:1px solid #344657;
}

#status {
  font-size:13px;
  margin-top:17px;
  color:#00e5a0;
}
</style>
</head>

<body>

<header>VISION <span>AI</span></header>

<main>
<h1>Visão computacional.</h1>

<p>Reconhecimento inteligente de movimentos em tempo real.</p>

<div class="screen">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="controls">
  <button id="start">ATIVAR CÂMERA</button>
  <button id="switch">TROCAR CÂMERA</button>
</div>

<div id="status">Sistema aguardando inicialização.</div>
</main>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let stream = null;
let cameraFacing = "environment";
let hands = null;
let running = false;
let processing = false;

hands = new Hands({
  locateFile: file =>
    "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(results => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (!results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0) {
    status.textContent = "Procurando mãos...";
    return;
  }

  results.multiHandLandmarks.forEach(hand => {

    const links = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17]
    ];

    ctx.strokeStyle = "#00e5a0";
    ctx.lineWidth = 4;

    links.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(
        hand[a].x * canvas.width,
        hand[a].y * canvas.height
      );
      ctx.lineTo(
        hand[b].x * canvas.width,
        hand[b].y * canvas.height
      );
      ctx.stroke();
    });

    hand.forEach(point => {
      ctx.beginPath();
      ctx.arc(
        point.x * canvas.width,
        point.y * canvas.height,
        5,0,Math.PI*2
      );
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#00e5a0";
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  });

  status.textContent =
    "Mãos detectadas: " + results.multiHandLandmarks.length;
});

async function startCamera() {
  try {
    running = false;
    processing = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    status.textContent = "Conectando à câmera...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:cameraFacing},
        width:{ideal:640},
        height:{ideal:480}
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    status.textContent =
      cameraFacing === "environment"
      ? "Câmera traseira ativada."
      : "Câmera frontal ativada.";

    processFrames();

  } catch(error) {
    running = false;
    status.textContent =
      "Erro: " + error.name + " - " + error.message;
  }
}

async function processFrames() {
  if (!running) return;

  if (video.readyState >= 2 && !processing) {
    processing = true;

    try {
      await hands.send({image:video});
    } catch(error) {
      status.textContent = "Erro no reconhecimento.";
    }

    processing = false;
  }

  if (running) {
    requestAnimationFrame(processFrames);
  }
}

document.getElementById("start").onclick = startCamera;

document.getElementById("switch").onclick = async () => {
  cameraFacing =
    cameraFacing === "environment"
    ? "user"
    : "environment";

  await startCamera();
};
</script>

</body>
</html>
