
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISION AI</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#080b10;color:white;font-family:Arial}
header{font-size:23px;font-weight:bold;letter-spacing:3px}
header span{color:#00e5a0}
main{max-width:750px;margin:45px auto}
h1{font-size:32px}
p{color:#929ba8}
.screen{position:relative;background:#111923;border:1px solid #263342;border-radius:16px;overflow:hidden;margin-top:25px}
video{width:100%;display:block;transform:none}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:none}
.controls{display:flex;gap:10px;margin-top:15px}
button{flex:1;padding:16px 8px;border:0;border-radius:10px;font-weight:bold;font-size:13px}
#start{background:#00e5a0;color:#00150e}
#switch{background:#1c2935;color:white;border:1px solid #344657}
#status{font-size:13px;margin-top:17px;color:#00e5a0}
</style>
</head>
<body>
<header>VISION <span>AI</span></header>
<main>
<h1>Visão computacional.</h1>
<p>Reconhecimento inteligente em tempo real.</p>

<div class="screen">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>

<div class="controls">
<button id="start">ATIVAR IA</button>
<button id="switch">TROCAR CÂMERA</button>
</div>
<div id="status">Aguardando inicialização.</div>
</main>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");

let stream=null;
let facing="environment";
let ai=null;
let aiActive=false;
let busy=false;

async function openCamera(){
try{
if(stream)stream.getTracks().forEach(t=>t.stop());

stream=await navigator.mediaDevices.getUserMedia({
audio:false,
video:{
facingMode:{ideal:facing},
width:{ideal:640},
height:{ideal:480}
}
});

video.srcObject=stream;
video.style.transform="none";
canvas.style.transform="none";

await video.play();
status.textContent="Câmera funcionando. IA aguardando.";
}catch(e){
status.textContent="Erro da câmera: "+e.name+" - "+e.message;
}
}

function draw(results){
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
ctx.clearRect(0,0,canvas.width,canvas.height);

const all=results.multiHandLandmarks||[];

all.forEach(hand=>{
const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

ctx.strokeStyle="#00e5a0";
ctx.lineWidth=4;

links.forEach(([a,b])=>{
ctx.beginPath();
ctx.moveTo(hand[a].x*canvas.width,hand[a].y*canvas.height);
ctx.lineTo(hand[b].x*canvas.width,hand[b].y*canvas.height);
ctx.stroke();
});

hand.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x*canvas.width,p.y*canvas.height,5,0,Math.PI*2);
ctx.fillStyle="white";
ctx.fill();
});
});

status.textContent=all.length?"Mãos detectadas: "+all.length:"IA ativa. Procurando mãos...";
}

async function startAI(){
if(aiActive)return;

try{
if(!video.srcObject)await openCamera();
if(!video.srcObject)return;

status.textContent="Carregando inteligência artificial...";

if(!ai){
ai=new Hands({
locateFile:file=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file
});

ai.setOptions({
maxNumHands:2,
modelComplexity:1,
minDetectionConfidence:0.6,
minTrackingConfidence:0.6
});

ai.onResults(draw);
}

aiActive=true;
status.textContent="IA ativa. Mostre suas mãos.";
process();

}catch(e){
aiActive=false;
status.textContent="Erro na IA: "+e.message;
}
}

async function process(){
if(!aiActive)return;

if(video.readyState>=2&&!busy){
busy=true;
try{
await ai.send({image:video});
}catch(e){
status.textContent="Erro de processamento: "+e.message;
aiActive=false;
}
busy=false;
}

if(aiActive)requestAnimationFrame(process);
}

document.getElementById("start").onclick=startAI;

document.getElementById("switch").onclick=async()=>{
aiActive=false;
facing=facing==="environment"?"user":"environment";
await openCamera();

if(ai){
await ai.close();
ai=null;
}

status.textContent="Câmera trocada. Toque em ATIVAR IA.";
};

openCamera();
</script>
</body>
</html>
