
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENTINELA AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d13;color:#eaf1f7;
 font-family:Arial,sans-serif;padding:20px;
}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{
 width:43px;height:43px;border-radius:12px;
 background:#142d32;color:#55d6ad;
 display:grid;place-items:center;font-size:23px
}
h1{font-size:19px;margin:0;letter-spacing:1px}
header p{margin:4px 0 0;color:#81909e;font-size:12px}
.status{margin-left:auto;color:#55d6ad;font-size:11px}
main{max-width:650px;margin:auto}
.camera{
 width:100%;background:#111a24;border:1px solid #263443;
 border-radius:15px;overflow:hidden;position:relative;
}
video{display:none}
canvas{display:block;width:100%;height:auto;min-height:220px}
.placeholder{
 position:absolute;inset:0;display:grid;place-items:center;
 color:#718294;font-size:14px;pointer-events:none
}
.controls{display:flex;gap:10px;margin:15px 0}
button{
 border:0;border-radius:10px;padding:15px 12px;
 font-size:14px;font-weight:bold;cursor:pointer
}
#start{background:#43c69b;color:#06130f;flex:1}
#stop{background:#253341;color:white}
.stats{
 display:grid;grid-template-columns:1fr 1fr;gap:12px
}
.stat{
 background:#111a24;border:1px solid #263443;
 padding:17px;border-radius:12px
}
.stat small{color:#91a0af;font-size:11px}
.stat strong{display:block;font-size:28px;margin-top:8px}
.events{
 margin-top:14px;background:#111a24;
 border:1px solid #263443;border-radius:12px;padding:16px
}
.events h3{font-size:14px;margin:0 0 12px}
#log{font-size:12px;color:#aab8c5;line-height:1.8}
footer{text-align:center;color:#526171;font-size:11px;margin:22px}
</style>
</head>
<body>
<header>
 <div class="logo">⬡</div>
 <div>
  <h1>SENTINELA AI</h1>
  <p>Monitoramento inteligente</p>
 </div>
 <div class="status" id="status">● DESLIGADO</div>
</header>

<main>
 <div class="camera">
  <video id="video" playsinline muted></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div class="placeholder" id="placeholder">
   Câmera aguardando ativação
  </div>
 </div>

 <div class="controls">
  <button id="start">INICIAR MONITORAMENTO</button>
  <button id="stop">PARAR</button>
 </div>

 <div class="stats">
  <div class="stat">
   <small>PESSOAS DETECTADAS</small>
   <strong id="count">0</strong>
  </div>
  <div class="stat">
   <small>OCORRÊNCIAS</small>
   <strong id="alerts">0</strong>
  </div>
 </div>

 <div class="events">
  <h3>HISTÓRICO DE EVENTOS</h3>
  <div id="log">Sistema aguardando inicialização.</div>
 </div>
</main>

<footer>SENTINELA AI • SISTEMA DE VISÃO COMPUTACIONAL</footer>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const stop=document.getElementById("stop");
const status=document.getElementById("status");
const placeholder=document.getElementById("placeholder");
const count=document.getElementById("count");
const alerts=document.getElementById("alerts");
const log=document.getElementById("log");

let stream=null;
let running=false;
let detector=null;
let lastDetection=0;
let eventCount=0;

function event(text){
 const time=new Date().toLocaleTimeString("pt-BR");
 log.innerHTML=time+" — "+text+"<br>"+log.innerHTML;
}

async function loadDetector(){
 if(detector)return detector;
 if(!("BarcodeDetector" in window) && !("FaceDetector" in window)){
   // O detector de pessoas será carregado pela biblioteca abaixo.
 }
 const vision=await import(
 "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/+esm"
 );
 const tf=await import(
 "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/+esm"
 );
 await tf.ready();
 detector=await vision.load({base:"lite_mobilenet_v2"});
 return detector;
}

function draw(){
 if(!running)return;
 if(video.readyState>=2){
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
 }
 requestAnimationFrame(draw);
}

async function detect(){
 while(running){
  if(detector && video.readyState>=2){
   try{
    const predictions=await detector.detect(video,10,0.45);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    let people=0;
    for(const p of predictions){
     if(p.class!=="person")continue;
     people++;
     const [x,y,w,h]=p.bbox;
     const sx=canvas.width/video.videoWidth;
     const sy=canvas.height/video.videoHeight;
     ctx.strokeStyle="#48e0ad";
     ctx.lineWidth=3;
     ctx.strokeRect(x*sx,y*sy,w*sx,h*sy);
     ctx.fillStyle="#48e0ad";
     ctx.fillRect(x*sx,y*sy,95,22);
     ctx.fillStyle="#07130f";
     ctx.font="bold 12px Arial";
     ctx.fillText("PESSOA",x*sx+5,y*sy+15);
    }
    count.textContent=people;
   }catch(e){}
  }
  await new Promise(r=>setTimeout(r,350));
 }
}

start.addEventListener("click",async()=>{
 if(running)return;
 try{
  status.textContent="● INICIANDO";
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:"environment",
    width:{ideal:640},
    height:{ideal:480}
   }
  });
  video.srcObject=stream;
  await video.play();
  canvas.width=640;
  canvas.height=480;
  running=true;
  placeholder.style.display="none";
  status.textContent="● CÂMERA ATIVA";
  event("Câmera iniciada.");
  requestAnimationFrame(draw);
  event("Carregando inteligência artificial...");
  await loadDetector();
  if(running){
   status.textContent="● IA ATIVA";
   event("Detector de pessoas pronto.");
   detect();
  }
 }catch(e){
  status.textContent="● ERRO";
  event("Não foi possível iniciar: "+e.message);
  running=false;
 }
});

stop.addEventListener("click",()=>{
 running=false;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 video.srcObject=null;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 placeholder.style.display="grid";
 status.textContent="● DESLIGADO";
 count.textContent="0";
 event("Monitoramento encerrado.");
});

window.addEventListener("pagehide",()=>{
 if(stream)stream.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
