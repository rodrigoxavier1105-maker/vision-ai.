
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VISION AI</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 16px;
}

h1 {
  letter-spacing: 4px;
  margin-top: 15px;
}

p { color: #aab4c5; }

.camera {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 4 / 3;
  margin: 20px auto;
  background: #151b27;
  border: 2px solid #26354c;
  border-radius: 14px;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
}

button {
  display: block;
  width: 100%;
  max-width: 600px;
  margin: 12px auto;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #1479ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.panel {
  max-width: 600px;
  margin: 12px auto;
  padding: 15px;
  background: #111a29;
  border: 1px solid #26354c;
  border-radius: 12px;
  text-align: left;
}

.panel h3 {
  margin-top: 0;
  color: #5da5ff;
}

.result {
  color: #5ee6a8;
  font-size: 14px;
  line-height: 1.8;
}

#status {
  color: #5ee6a8;
  margin: 18px auto;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>VISION AI</h1>
<p>Sistema de visão computacional</p>

<div class="camera">
  <canvas id="screen"></canvas>
</div>

<button onclick="startCamera()">ATIVAR CÂMERA</button>
<button onclick="switchCamera()">TROCAR CÂMERA</button>

<div id="status">Câmera desligada</div>

<div class="panel">
  <h3>IDENTIFICAÇÃO DE MÃOS</h3>
  <div id="hands" class="result">Aguardando câmera...</div>
</div>

<div class="panel">
  <h3>IDENTIFICAÇÃO FACIAL</h3>
  <div id="faces" class="result">Aguardando câmera...</div>
</div>

<div class="panel">
  <h3>SISTEMA</h3>
  <div id="system" class="result">
    Modelos aguardando inicialização.
  </div>
</div>

<video id="video" autoplay playsinline muted
style="display:none"></video>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker,
  FaceLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const handsText = document.getElementById("hands");
const facesText = document.getElementById("faces");
const systemText = document.getElementById("system");

const WASM =
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

const HAND_MODEL =
"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const FACE_MODEL =
"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

let stream = null;
let cameraMode = "user";
let animation = null;
let running = false;
let loading = false;

let handModel = null;
let faceModel = null;

let lastDetection = 0;
let handResults = null;
let faceResults = null;

async function loadModels() {
  if (handModel && faceModel) return;

  if (loading) return;

  loading = true;
  systemText.textContent = "Carregando inteligência artificial...";

  try {
    const vision = await FilesetResolver.forVisionTasks(WASM);

    handModel = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: HAND_MODEL,
        delegate: "CPU"
      },
      runningMode: "VIDEO",
      numHands: 2
    });

    faceModel = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: FACE_MODEL,
        delegate: "CPU"
      },
      runningMode: "VIDEO",
      numFaces: 5,
      outputFaceBlendshapes: true
    });

    systemText.textContent =
      "Modelo de mãos: ativo | Modelo facial: ativo";

  } catch (error) {
    systemText.textContent = "Erro ao carregar modelos: " + error.message;
    throw error;
  } finally {
    loading = false;
  }
}

async function startCamera() {
  try {
    stopCamera();

    statusText.textContent = "Iniciando câmera...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: cameraMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    statusText.textContent = "Câmera ativa. Inicializando IA...";

    await loadModels();

    running = true;
    lastDetection = 0;
    drawCamera();

  } catch (error) {
    statusText.textContent = "Erro: " + error.message;
  }
}

function stopCamera() {
  running = false;

  if (animation) {
    cancelAnimationFrame(animation);
    animation = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

async function switchCamera() {
  cameraMode = cameraMode === "user" ? "environment" : "user";
  await startCamera();
}

function drawCamera() {
  if (!running || video.readyState < 2) {
    if (running) animation = requestAnimationFrame(drawCamera);
    return;
  }

  const width = video.videoWidth;
  const height = video.videoHeight;

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }

  ctx.clearRect(0, 0, width, height);

  if (cameraMode === "user") {
    // Correção de espelhamento já validada
    ctx.save();
    ctx.translate(width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, width, height);
    ctx.restore();
  } else {
    ctx.drawImage(video, 0, 0, width, height);
  }

  const now = performance.now();

  if (handModel && faceModel && now - lastDetection > 100) {
    lastDetection = now;

    try {
      handResults = handModel.detectForVideo(canvas, now);
      faceResults = faceModel.detectForVideo(canvas, now);

      updateHandInfo();
      updateFaceInfo();

    } catch (error) {
      systemText.textContent = "Falha na análise: " + error.message;
    }
  }

  drawHands();
  drawFaces();

  animation = requestAnimationFrame(drawCamera);
}

const connections = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function drawHands() {
  if (!handResults || !handResults.landmarks) return;

  const width = canvas.width;
  const height = canvas.height;

  handResults.landmarks.forEach((points, index) => {
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#00e5ff";

    connections.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo(points[a].x * width, points[a].y * height);
      ctx.lineTo(points[b].x * width, points[b].y * height);
      ctx.stroke();
    });

    points.forEach(point => {
      ctx.beginPath();
      ctx.arc(
        point.x * width,
        point.y * height,
        5,
        0,
        Math.PI * 2
      );
      ctx.fillStyle = "#ffcc00";
      ctx.fill();
    });

    const x = points[0].x * width;
    const y = points[0].y * height;

    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 22px Arial";
    ctx.fillText("MÃO " + (index + 1), x + 10, y - 15);
  });
}

function countFingers(points) {
  let count = 0;

  // Quatro dedos principais
  const fingers = [
    [8,6],
    [12,10],
    [16,14],
    [20,18]
  ];

  fingers.forEach(([tip,pip]) => {
    if (points[tip].y < points[pip].y) count++;
  });

  // Estimativa de abertura do polegar
  const thumbTip = points[4];
  const thumbIP = points[3];
  const indexBase = points[5];

  const distance = (a,b) =>
    Math.hypot(a.x-b.x, a.y-b.y);

  if (
    distance(thumbTip,indexBase) >
    distance(thumbIP,indexBase) * 1.15
  ) {
    count++;
  }

  return count;
}

function updateHandInfo() {
  const detected = handResults?.landmarks || [];

  if (detected.length === 0) {
    handsText.textContent = "Nenhuma mão identificada.";
    return;
  }

  handsText.innerHTML = "";

  detected.forEach((points,index) => {
    const fingers = countFingers(points);

    let gesture = fingers === 0
      ? "Mão fechada (estimativa)"
      : fingers === 5
      ? "Mão aberta (estimativa)"
      : fingers + " dedos";

    const line = document.createElement("div");
    line.textContent = "Mão " + (index+1) + ": " + gesture;
    handsText.appendChild(line);
  });
}

function drawFaces() {
  if (!faceResults || !faceResults.faceLandmarks) return;

  const width = canvas.width;
  const height = canvas.height;

  faceResults.faceLandmarks.forEach((points,index) => {
    let minX = 1, minY = 1, maxX = 0, maxY = 0;

    points.forEach(point => {
      minX = Math.min(minX,point.x);
      minY = Math.min(minY,point.y);
      maxX = Math.max(maxX,point.x);
      maxY = Math.max(maxY,point.y);
    });

    ctx.strokeStyle = "#00ff88";
    ctx.lineWidth = 3;
    ctx.strokeRect(
      minX * width,
      minY * height,
      (maxX-minX) * width,
      (maxY-minY) * height
    );

    ctx.fillStyle = "#00ff88";
    ctx.font = "bold 22px Arial";
    ctx.fillText(
      "ROSTO " + (index+1),
      minX * width,
      minY * height - 10
    );
  });
}

function updateFaceInfo() {
  const detected = faceResults?.faceLandmarks || [];

  if (detected.length === 0) {
    facesText.textContent = "Nenhum rosto identificado.";
    return;
  }

  facesText.innerHTML = "";

  detected.forEach((points,index) => {
    let expression = "Rosto detectado";

    const categories =
      faceResults.faceBlendshapes?.[index]?.categories || [];

    const score = name =>
      categories.find(item => item.categoryName === name)?.score || 0;

    const smile = score("mouthSmileLeft") + score("mouthSmileRight");
    const openMouth = score("jawOpen");

    if (smile > 0.8) {
      expression = "Possível sorriso";
    } else if (openMouth > 0.45) {
      expression = "Boca aberta";
    }

    const line = document.createElement("div");
    line.textContent = "Rosto " + (index+1) + ": " + expression;
    facesText.appendChild(line);
  });
}

window.addEventListener("beforeunload", stopCamera);
</script>

</body>
</html>
